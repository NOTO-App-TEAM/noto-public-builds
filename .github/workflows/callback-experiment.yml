name: Callback experiment

# Sandbox experiment: does a workflow_dispatch triggered by GITHUB_TOKEN create
# a run? Does a workflow dispatch itself? (NOTO-97 research, removed after use.)

on:
  workflow_dispatch:
    inputs:
      attempt:
        description: Dispatch counter.
        required: false
        default: '0'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: Dispatch the same workflow again
    runs-on: ubuntu-22.04
    steps:
      - name: Dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ATTEMPT: ${{ inputs.attempt }}
          WORKFLOW: ${{ github.workflow }}
        run: |
          set -u
          next=$((ATTEMPT + 1))
          code=$(curl -s -o /tmp/body -w '%{http_code}' -X POST \
            "https://api.github.com/repos/$REPO/actions/workflows/$WORKFLOW/dispatches" \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -d "{\"ref\":\"$GITHUB_REF_NAME\",\"inputs\":{\"attempt\":\"$next\"}}")
          echo "DISPATCH attempt=$next -> $code"
          head -c 300 /tmp/body
          echo
