name: Gateway shape probe

# Temporary probe: what does the review gateway answer right now, and does the
# answer satisfy the review schema? Removed after the check.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe the review gateway
    runs-on: ubuntu-22.04
    steps:
      - name: Ask the gateway for a review-shaped answer
        env:
          OPENAI_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          OPENAI_API_BASE: https://amr-link.open-design.ai/v1
        run: |
          set -u
          code=$(curl -s -o /tmp/body -w '%{http_code}' -X POST "$OPENAI_API_BASE/chat/completions" \
            -H "Authorization: Bearer $OPENAI_API_KEY" -H "Content-Type: application/json" \
            -d '{"model":"deepseek-v4.1-flash-eco","max_tokens":4000,"messages":[{"role":"system","content":"Answer with a JSON object only."},{"role":"user","content":"Return JSON: {\"review\": {\"issues\": [{\"file\":\"a.py\",\"line\":1,\"issue\":\"x\",\"suggestion_code\":\"y\",\"severity\":\"minor\",\"confidence\":0.9}]}}}"}]}')
          echo "HTTP -> $code"
          head -c 2500 /tmp/body
          echo
