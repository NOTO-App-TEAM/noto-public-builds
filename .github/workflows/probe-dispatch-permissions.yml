name: Probe dispatch permissions

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  probe:
    name: Probe GITHUB_TOKEN rights after an API dispatch
    runs-on: ubuntu-22.04
    steps:
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          probe() {
            local label="$1"; shift
            local code
            code=$(curl -s -o /tmp/body -w '%{http_code}' "$@")
            echo "PROBE $label -> $code"
            head -c 300 /tmp/body
            echo
          }
          probe create_release "https://api.github.com/repos/$REPO/releases" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            -d '{"tag_name":"probe-dispatch-permissions","name":"probe","draft":true,"body":"probe"}'
          probe list_artifacts "https://api.github.com/repos/$REPO/actions/artifacts" \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"
