name: Public builds

# Hosted build farm for the private NOTO repository (NOTO-96).
#
# Why this repository exists: standard GitHub-hosted runners are free in public
# repositories, so Linux, macOS and iOS builds plus the Windows installer can
# run here without consuming the private repository's minutes. No product code
# is stored in this repository: every job checks the private repository out at
# the requested commit using a read-only fine-grained token.
#
# Triggers are dispatch-only on purpose. A `pull_request` trigger here would let
# any fork run its own code on the private checkout; that is why it is absent.
on:
  repository_dispatch:
    types: [noto-build]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit in the private repository to build.
        required: true
      ref:
        description: Ref name (branch or tag) for the release label.
        required: false
        default: main
      tag:
        description: Release tag the private workflow will publish.
        required: false
        default: latest

permissions:
  contents: read

concurrency:
  group: noto-builds-${{ github.event.client_payload.sha || inputs.sha }}
  cancel-in-progress: false

env:
  PRIVATE_REPOSITORY: NOTO-App-TEAM/NOTO
  TAURI_CLI_VERSION: '2.11.3'
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  # ── Linux desktop ──────────────────────────────────────────────────────────
  linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout the private repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ github.event.client_payload.sha || inputs.sha }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libglib2.0-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libssl-dev libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@083fe80ad9eef062785971a2d47135b1f499d5e1 # 1.96.1
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './backend -> target'

      - name: Install Tauri CLI
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: tauri-cli@2.11.3

      - name: Build
        working-directory: backend
        run: cargo tauri build --verbose

      - name: Upload Linux bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: noto-linux
          retention-days: 3
          path: |
            backend/target/release/bundle/**/*
          if-no-files-found: error

  # ── macOS (universal) ──────────────────────────────────────────────────────
  macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout the private repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ github.event.client_payload.sha || inputs.sha }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@083fe80ad9eef062785971a2d47135b1f499d5e1 # 1.96.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './backend -> target'

      - name: Install Tauri CLI
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: tauri-cli@2.11.3

      - name: Detect signing configuration
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APPLE_CERTIFICATE is not configured - building an ad-hoc signed bundle"
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-$(openssl rand -hex 16)}"
          printf '%s' "$APPLE_CERTIFICATE" | tr -d '\n\r ' | openssl base64 -d -A > certificate.p12
          if [ ! -s certificate.p12 ]; then
            echo "::error::APPLE_CERTIFICATE did not decode to a valid .p12 file"
            exit 1
          fi
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f certificate.p12
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | grep "Developer ID Application" | head -1 \
            | sed -E 's/^[^"]*"([^"]+)".*$/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::Developer ID Application certificate not found in the imported keychain"
            exit 1
          fi
          {
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_ID=$APPLE_ID"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "Signing identity: $IDENTITY"

      - name: Configure ad-hoc signing fallback
        if: steps.signing.outputs.enabled != 'true'
        run: |
          echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          echo "::warning::No Apple certificate configured - ad-hoc signing, Gatekeeper will warn users"

      - name: Build
        working-directory: backend
        run: cargo tauri build --target universal-apple-darwin

      - name: Verify bundle
        run: |
          APP=$(find backend/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "::error::macOS app bundle not found"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Upload macOS bundles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: noto-macos
          retention-days: 3
          path: backend/target/universal-apple-darwin/release/bundle/**/*
          if-no-files-found: error

  # ── Windows installer (MSI + NSIS) ─────────────────────────────────────────
  windows-installer:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - name: Checkout the private repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ github.event.client_payload.sha || inputs.sha }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@083fe80ad9eef062785971a2d47135b1f499d5e1 # 1.96.1
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './backend -> target'

      - name: Install Tauri CLI
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: tauri-cli@2.11.3

      - name: Build installers (full WiX validation)
        working-directory: backend
        run: cargo tauri build --verbose

      - name: Upload Windows installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: noto-windows
          retention-days: 3
          path: backend/target/release/bundle/**/*
          if-no-files-found: error

  # ── Android APK ────────────────────────────────────────────────────────────
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the private repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ github.event.client_payload.sha || inputs.sha }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false

      - name: Install Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r26d
          cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@083fe80ad9eef062785971a2d47135b1f499d5e1 # 1.96.1
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './backend -> target'

      - name: Install Tauri CLI
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: tauri-cli@2.11.3

      - name: Build APK
        working-directory: ./backend
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo tauri android init --ci
          cargo tauri android build --target aarch64 --apk

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: noto-android
          retention-days: 3
          path: |
            backend/gen/android/app/build/outputs/apk/**/*.apk
            backend/target/release/bundle/apk/*.apk
          if-no-files-found: error

  # ── iOS (unsigned) ─────────────────────────────────────────────────────────
  # Unsigned iOS builds need a provisioning profile for anything beyond a
  # project skeleton. This job therefore does not gate the release: a missing
  # iOS artifact fails this job loudly (if-no-files-found: error), and the
  # collector in the private repository reports the missing iOS build in the
  # release body and run summary. The release still publishes the platforms
  # that can be built without Apple provisioning.
  ios:
    name: Build iOS (unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout the private repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.PRIVATE_REPOSITORY }}
          ref: ${{ github.event.client_payload.sha || inputs.sha }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@083fe80ad9eef062785971a2d47135b1f499d5e1 # 1.96.1
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Install iOS prerequisites
        run: brew install xcodegen libimobiledevice
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './backend -> target'

      - name: Install Tauri CLI
        uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2
        with:
          tool: tauri-cli@2.11.3

      - name: Build iOS app
        working-directory: ./backend
        run: |
          cargo tauri ios init --ci
          cargo tauri ios build --no-sign

      - name: Upload iOS app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: noto-ios
          retention-days: 3
          path: |
            backend/gen/apple/build/**/*.app
            backend/target/release/bundle/ios/*.ipa
          if-no-files-found: error
