name: Artifact handoff experiment

# Sandbox experiment: can one workflow download an artifact uploaded by another
# run of the same repository, using run-id + github-token? (NOTO-97 research)

on:
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: Run that uploaded the artifact.
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  produce:
    name: Produce
    if: inputs.producer_run_id == ''
    runs-on: ubuntu-22.04
    steps:
      - name: Write marker
        shell: bash
        run: echo "produced by $GITHUB_RUN_ID" > marker.txt
      - name: Upload marker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: handoff-marker
          retention-days: 1
          path: marker.txt
          if-no-files-found: error

  consume:
    name: Consume
    if: inputs.producer_run_id != ''
    runs-on: ubuntu-22.04
    steps:
      - name: Download the artifact of the producer run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: handoff-marker
          path: received
          run-id: ${{ inputs.producer_run_id }}
          github-token: ${{ github.token }}
      - name: Show what arrived
        shell: bash
        run: cat received/marker.txt
